version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
    environment:
      - DJANGO_SECRET_KEY=change-me-in-production
      - DB_HOST=mysql
      - DB_NAME=esight
      - DB_USER=root
      - DB_PASSWORD=esight123
      - REDIS_HOST=redis
      - DJANGO_DEBUG=False
    volumes:
      - ../static:/app/static
      - ../logs:/app/logs
    restart: unless-stopped

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - mysql
      - redis
    environment:
      - DJANGO_SECRET_KEY=change-me-in-production
      - DB_HOST=mysql
      - DB_NAME=esight
      - DB_USER=root
      - DB_PASSWORD=esight123
      - REDIS_HOST=redis
    command: celery -A esight worker -l info -c 8 -Q default,alarm,performance,discovery
    restart: unless-stopped

  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - redis
    environment:
      - DJANGO_SECRET_KEY=change-me-in-production
      - DB_HOST=mysql
      - DB_NAME=esight
      - DB_USER=root
      - DB_PASSWORD=esight123
      - REDIS_HOST=redis
    command: celery -A esight beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped

  trap-receiver:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "162:162/udp"
    environment:
      - DJANGO_SECRET_KEY=change-me-in-production
      - DB_HOST=mysql
      - DB_NAME=esight
      - DB_USER=root
      - DB_PASSWORD=esight123
      - REDIS_HOST=redis
    command: python manage.py start_trap_receiver
    restart: unless-stopped

  syslog-receiver:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "514:514/udp"
    environment:
      - DJANGO_SECRET_KEY=change-me-in-production
      - DB_HOST=mysql
      - DB_NAME=esight
      - DB_USER=root
      - DB_PASSWORD=esight123
      - REDIS_HOST=redis
    command: python manage.py start_syslog_receiver
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=esight123
      - MYSQL_DATABASE=esight
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../static:/usr/share/nginx/html/static
      - ../templates/index.html:/usr/share/nginx/html/index.html
    depends_on:
      - web
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
